<!-- Splash Screen Styles for iOS -->
<style>
  /* âââ RESET & BASE âââ */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%; width: 100%;
    overflow: hidden;
    background: #0a0a08;
    color: #e8e0d0;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* âââ CSS VARIABLES âââ */
  :root {
    --gold: #c4a35a;
    --gold-dark: #8b6914;
    --gold-light: #f0e6cc;
    --bg: #0a0a08;
    --bg-elevated: rgba(255,255,255,0.03);
    --bg-subtle: rgba(196,163,90,0.02);
    --border: rgba(196,163,90,0.1);
    --border-subtle: rgba(196,163,90,0.06);
    --text-primary: #e8e0d0;
    --text-muted: #8a7d65;
    --text-dim: #6b6150;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
    --ig: #E1306C;
    --tk: #00f2ea;
    --yt: #FF0000;
    --kw: #ff6a00;
  }

  /* âââ APP SHELL âââ */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    width: 100%;
    position: relative;
    overflow: hidden;
  }

  /* âââ HEADER âââ */
  .header {
    padding: calc(var(--safe-top) + 10px) 16px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-subtle);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; color: var(--bg);
    letter-spacing: -0.5px;
    box-shadow: 0 2px 12px rgba(196,163,90,0.2);
  }

  .header-title {
    font-size: 15px; font-weight: 800;
    color: var(--gold);
    letter-spacing: 1px;
  }

  .header-sub {
    font-size: 10px; color: var(--text-muted);
    letter-spacing: 0.3px;
    margin-top: 1px;
  }

  .header-actions {
    display: flex; gap: 6px;
  }

  .icon-btn {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 1px solid rgba(196,163,90,0.15);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    -webkit-appearance: none;
    transition: all 0.2s;
  }

  .icon-btn:active {
    background: rgba(196,163,90,0.1);
    transform: scale(0.92);
  }

  /* âââ STATS BAR âââ */
  .stats-bar {
    display: flex;
    gap: 6px;
    padding: 10px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .stats-bar::-webkit-scrollbar { display: none; }

  .stat-card {
    flex: 1 0 72px;
    min-width: 72px;
    padding: 8px 8px;
    border-radius: 12px;
    background: var(--bg-elevated);
    border: 1px solid rgba(196,163,90,0.06);
    text-align: center;
  }

  .stat-label {
    font-size: 9px; font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 18px; font-weight: 900;
    color: var(--gold-light);
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  .stat-bar-track {
    height: 3px; border-radius: 2px;
    background: rgba(255,255,255,0.06);
    margin-top: 5px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .stat-meta {
    font-size: 9px;
    color: rgba(196,163,90,0.4);
    margin-top: 3px;
  }

  /* âââ PLATFORM FILTER âââ */
  .platforms {
    display: flex;
    gap: 5px;
    padding: 8px 16px;
    overflow-x: auto;
    border-bottom: 1px solid var(--border-subtle);
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .platforms::-webkit-scrollbar { display: none; }

  .plat-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(196,163,90,0.12);
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    -webkit-appearance: none;
    transition: all 0.2s;
  }

  .plat-btn.active {
    border-color: var(--gold);
    background: rgba(196,163,90,0.12);
    color: var(--gold);
  }

  .plat-btn:active {
    transform: scale(0.95);
  }

  /* âââ CHAT AREA âââ */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 8px;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }

  /* âââ WELCOME SCREEN âââ */
  .welcome {
    text-align: center;
    padding: 24px 16px 18px;
    margin-bottom: 10px;
  }

  .welcome-icon {
    font-size: 40px;
    margin-bottom: 8px;
    animation: welcomePulse 2s ease-in-out infinite;
  }

  @keyframes welcomePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  .welcome-title {
    font-size: 18px; font-weight: 800;
    color: var(--gold);
    margin-bottom: 4px;
  }

  .welcome-sub {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  /* âââ QUICK ACTIONS GRID âââ */
  .quick-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    padding: 0 0 12px;
  }

  .quick-btn {
    padding: 13px 12px;
    border-radius: 14px;
    border: 1px solid rgba(196,163,90,0.1);
    background: var(--bg-elevated);
    color: #d4c8a8;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    text-align: left;
    line-height: 1.4;
    -webkit-appearance: none;
    transition: all 0.15s;
  }

  .quick-btn:active {
    border-color: var(--gold);
    background: rgba(196,163,90,0.08);
    transform: scale(0.97);
  }

  /* âââ QUICK ACTIONS INLINE (when chat has messages) âââ */
  .quick-inline {
    padding: 0 16px;
    flex-shrink: 0;
  }

  .quick-toggle {
    width: 100%;
    padding: 6px;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 10px;
    font-weight: 700;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .quick-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }

<script>

const SYSTEM_PROMPT = `Voce e o SOCIAL SUPER â o estrategista senior de midias sociais da dupla Edy & Nathan (@edyenathan), especialista em crescimento organico, engajamento e conversao para artistas de forro e vaquejada.

- DNA: autenticidade sertaneja, "Jeito Matuto", vaquejada real
- Identidade visual: dourado + preto, tipografia premium

METAS 15 DIAS (07-21/abr 2026):

- TikTok: 214K -> 500K
- YouTube: 149K -> 250K
- Kwai: 60K -> 150K

3 PILARES DE CONTEUDO:

FORMULA VIRAL COMPROVADA:

REGRAS OBRIGATORIAS:

3. CTA em TODOS os posts (comentario, DM, salvamento ou compartilhamento)
4. Identificar o pilar (A, B ou C) em cada conteudo
5. Formato curto: maximo 60s para Reels/TikTok, 15s para Stories
6. Referencia de estilo: Rey Vaqueiro, Ze Vaqueiro, Tarcisio, Luan Estilizado

const PLATFORMS = [

  { id: "ig", label: "Instagram", icon: "\uD83D\uDCF8" },
  { id: "tk", label: "TikTok", icon: "\uD83C\uDFB5" },
  { id: "yt", label: "YouTube", icon: "\u25B6\uFE0F" },
  { id: "kw", label: "Kwai", icon: "\uD83D\uDFE0" },
];

const QUICK_ACTIONS = [
  { id: "roteiro", label: "\uD83D\uDCDD Gerar Roteiro Viral", prompt: "Crie 3 roteiros virais completos (1 por pilar A, B, C). Cada um com: hook dos 3s, roteiro cena a cena, CTA final, melhor horario, hashtags e formato ideal." },
  { id: "hooks", label: "\uD83C\uDFA3 Banco de Hooks", prompt: "Gere 10 hooks matadores para os primeiros 3 segundos de Reels/TikTok. Divida por pilar (A, B, C). Cada hook deve causar interrupcao de scroll imediata." },
  { id: "calendario", label: "\uD83D\uDCC5 Calendario Semanal", prompt: "Monte um calendario editorial completo para os proximos 7 dias com 2 posts/dia. Inclua: dia, horario, plataforma, pilar (A/B/C), formato, hook, CTA e referencia visual." },
  { id: "garyvee", label: "\u267B\uFE0F Reaproveitamento GaryVee", prompt: "Pegue o conceito de 1 video de show ao vivo da dupla e transforme em 10+ micro conteudos: 3 Reels, 3 TikToks, 2 Stories, 1 carrossel e 1 YouTube Shorts. Cada um com hook e CTA." },
  { id: "ctas", label: "\uD83D\uDCAC CTAs de Engajamento", prompt: "Gere 15 CTAs poderosos divididos em 3 categorias: 5 para gerar COMENTARIOS, 5 para gerar COMPARTILHAMENTO via DM, 5 para gerar SALVAMENTOS. Todos no tom sertanejo da dupla." },
  { id: "trends", label: "\uD83D\uDD25 Trends Adaptadas", prompt: "Identifique 5 trends atuais (audios, formatos, challenges) e adapte cada uma para o universo forro/vaquejada de Edy & Nathan. Inclua roteiro completo de execucao." },
  { id: "b2b", label: "\uD83C\uDFDB\uFE0F Conteudo B2B Shows", prompt: "Crie 3 conteudos de vitrine para atrair prefeituras e contratantes de shows. Formato: Reels/carrossel mostrando estrutura, publico, energia do show. Com CTA direcionando pro WhatsApp comercial." },
  { id: "stories", label: "\uD83D\uDCF1 Sequencia Stories", prompt: "Monte uma sequencia de 8 Stories estrategicos para hoje. Inclua: stickers interativos (enquete, quiz, slider), mix de bastidor + conteudo + CTA. Objetivo: aumentar tempo de visualizacao e respostas." },
  { id: "caption", label: "\u270D\uFE0F Legendas Magneticas", prompt: "Escreva 5 legendas magneticas para posts do feed. Cada uma com: gancho na primeira linha, storytelling curto, CTA forte. Estilo autentico sertanejo, nunca generico." },
  { id: "collab", label: "\uD83E\uDD1D Estrategia Collabs", prompt: "Sugira 5 collabs estrategicas viaveis para Edy & Nathan. Para cada uma: artista/influencer, formato do conteudo, plataforma ideal, potencial de alcance e como abordar." },
];

const STATS = [
  { label: "IG", current: "615K", target: "800K", color: "var(--ig)", progress: 77 },
  { label: "TK", current: "214K", target: "500K", color: "var(--tk)", progress: 43 },
  { label: "YT", current: "149K", target: "250K", color: "var(--yt)", progress: 60 },
  { label: "KW", current: "60K", target: "150K", color: "var(--kw)", progress: 40 },
];

// âââ STATE âââ
let apiKey = "";
let chatHistory = [];
let currentPlatform = "all";
let isLoading = false;
let showQuickInline = false;

// âââ INIT âââ
function init() {
  try { apiKey = localStorage.getItem("ss_api_key") || ""; } catch(e) { apiKey = ""; }

  renderStats();
  renderPlatforms();
  renderQuickGrid();
  renderQuickScroll();
  updateApiModal();
  updateApiInputListener();
  setupInputField();
}

// âââ API KEY âââ
function updateApiModal() {
  document.getElementById("apiModal").classList.toggle("hidden", !!apiKey);
}

function updateApiInputListener() {
  const inp = document.getElementById("apiInput");
  const btn = document.getElementById("apiSubmit");
  inp.addEventListener("input", () => {
    const hasVal = inp.value.trim().length > 0;
    btn.classList.toggle("ready", hasVal);
  });
  inp.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && inp.value.trim()) saveApiKey();
  });
}

function saveApiKey() {
  const key = document.getElementById("apiInput").value.trim();
  if (!key) return;
  apiKey = key;
  try { localStorage.setItem("ss_api_key", key); } catch(e) {}
  updateApiModal();
}

function clearApiKey() {
  apiKey = "";
  try { localStorage.removeItem("ss_api_key"); } catch(e) {}
  document.getElementById("apiInput").value = "";
  document.getElementById("apiSubmit").classList.remove("ready");
  updateApiModal();
}

// âââ RENDER STATS âââ
function renderStats() {
  const container = document.getElementById("statsBar");
  container.innerHTML = STATS.map(s => `
    <div class="stat-card">
      <div class="stat-label" style="color:${s.color}">${s.label}</div>
      <div class="stat-value">${s.current}</div>
      <div class="stat-bar-track">
        <div class="stat-bar-fill" style="widt(:${s.progress}%;background:${s.color}"></div>
      </div>
      <div class="stat-meta">meta ${s.target}</div>
    </div>
  `).join("");
}

// âââ RENDER PLATFORMS âââ
function renderPlatforms() {
  const container = document.getElementById("platforms");
  container.innerHTML = PLATFORMS.map(p => `
    <button class="plat-btn ${p.id === currentPlatform ? 'active' : ''}"
            onclick="selectPlatform('${p.id}')">${p.icon} ${p.label}</button>
  `).join("");
}

function selectPlatform(id) {
  currentPlatform = id;
  renderPlatforms();
}

// âââ RENDER QUICK ACTIONS âââ
function renderQuickGrid() {
  const grid = document.getElementById("quickGrid");
  grid.innerHTML = QUICK_ACTIONS.map(a => `
    <button class="quick-btn" onclick="handleQuickAction('${a.id}')">${a.label}</button>
  `).join("");
}

function renderQuickScroll() {
  const scroll = document.getElementById("quickScroll");
  scroll.innerHTML = QUICK_ACTIONS.map(a => `
    <button class="quick-chip" onclick="handleQuickAction('${a.id}')">${a.label}</button>
  `).join("");
}

function handleQuickAction(id) {
  const action = QUICK_ACTIONS.find(a => a.id === id);
  if (action) sendMessage(action.prompt);
}

function toggleQuickInline() {
  showQuickInline = !showQuickInline;
  document.getElementById("quickScroll").classList.toggle("hidden", !showQuickInline);
  document.getElementById("quickToggle").textContent = showQuickInline ? "\u25B2 Ocultar acoes" : "\u25BC Acoes rapidas";
}

// âââ INPUT FIELD âââ
function setupInputField() {
  const field = document.getElementById("inputField");

  field.addEventListener("input", () => {
    field.style.height = "auto";
    field.style.height = Math.min(field.scrollHeight, 120) + "px";
    updateSendBtn();
  });

  field.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });
}

function updateSendBtn() {
  const btn = document.getElementById("sendBtn");
  const field = document.getElementById("inputField");
  const canSend = field.value.trim() && !isLoading;
  btn.classList.toggle("active", canSend);
}

function handleSend() {
  const field = document.getElementById("inputField");
  const text = field.value.trim();
  if (!text || isLoading) return;
  field.value = "";
  field.style.height = "auto";
  updateSendBtn();
  sendMessage(text);
}

// âââ MESSAGES âââ
function addMessage(role, content) {
  const chatArea = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.className = `msg-row ${role}`;
  div.innerHTML = `<div class="msg-bubble ${role}">${escapeHtml(content)}</div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function showTyping() {
  const chatArea = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.id = "typingIndicator";
  div.className = "typing";
  div.innerHTML = `
    <span class="typing-label">SOCIAL SUPER</span>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
    <div class="typing-dot"></div>
  `;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typingIndicator");
  if (el) el.remove();
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

// âââ SEND MESSAGE âââ
async function sendMessage(text) {
  if (isLoading) return;

  // Hide welcome, show inline quick actions
  document.getElementById("welcomeBlock").classList.add("hidden");
  document.getElementById("quickInline").classList.remove("hidden");
  document.getElementById("quickToggle").textContent = "\u25BC Acoes rapidas";
  showQuickInline = false;
  document.getElementById("quickScroll").classList.add("hidden");

  // Add user message
  const userMsg = { role: "user", content: text };
  chatHistory.push(userMsg);
  addMessage("user", text);

  isLoading = true;
  updateSendBtn();
  showTyping();
  document.getElementById("errorBar").classList.add("hidden");

  try {
    const reply = await callClaude(chatHistory, currentPlatform);
    const assistantMsg = { role: "assistant", content: reply };
    chatHistory.push(assistantMsg);
    hideTyping();
    addMessage("assistant", reply);
  } catch (err) {
    hideTyping();
    const errMsg = err.message || "Erro desconhecido";
    addMessage("assistant", "\u26A0\uFE0F Erro: " + errMsg);

    const errorBar = document.getElementById("errorBar");
    errorBar.textContent = errMsg;
    errorBar.classList.remove("hidden");

    if (errMsg.includes("invalid") || errMsg.includes("authentication") || errMsg.includes("401")) {
      clearApiKey();
    }
  } finally {
    isLoading = false;
    updateSendBtn();
  }
}

// âââ API CALL âââ
async function callClaude(messages, platformFilter) {
  const platformNote = platformFilter !== "all"
    ? `\n\nFOCO: Otimize tudo para ${PLATFORMS.find(p => p.id === platformFilter)?.label}. Adapte formatos, duracoes e linguagem para essa plataforma especifica.`
    : "";

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      system: SYSTEM_PROMPT + platformNote,
      messages: messages,
    }),
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `Erro da API: ${response.status}`);
  }

  const data = await response.json();
  return data.content
    ?.filter(b => b.type === "text")
    .map(b => b.text)
    .join("\n") || "Sem resposta.";
}

// âââ CLEAR CHAT âââ
function clearChat() {
  chatHistory = [];
  const chatArea = document.getElementById("chatArea");
  // Remove all messages and typing indicators
  chatArea.querySelectorAll(".msg-row, .typing").forEach(el => el.remove());
  // Show welcome again
  document.getElementById("welcomeBlock").classList.remove("hidden");
  document.getElementById("quickInline").classList.add("hidden");
  document.getElementById("errorBar").classList.add("hidden");
}

// âââ START âââ
document.addEventListener("DOMContentLoaded", init);
</script>
